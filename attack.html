<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24' fill='none' stroke='%232158ED' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'%3E%3C/path%3E%3Cpath d='M12 19s5.5-2.5 5.5-7.5V7.2l-5.5-2-5.5 2v4.3c0 5 5.5 7.5 5.5 7.5z' fill='%232158ED' stroke='none'%3E%3C/path%3E%3C/svg%3E" type="image/svg+xml" />
    <title>安全检查</title>
    <style>
        :root { --bg: #000000; --card: rgba(7,10,19,0.9); --blue: #2158ed; --text: #ffffff; --gray: #8e9aa8; --green: #00ffaa; }
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; position: relative; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        .grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(33,88,237,0.25) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(33,88,237,0.25) 1.5px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 2; }
        .card { background: var(--card); border: 2px solid var(--blue); box-shadow: 0 0 35px var(--blue), inset 0 0 20px rgba(33,88,237,0.15); border-radius: 20px; padding: 50px 35px; width: 88%; max-width: 420px; text-align: center; z-index: 10; box-sizing: border-box; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); animation: cardFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes cardFadeIn { 0% { opacity: 0; transform: translateY(12px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .status { display: inline-flex; align-items: center; gap: 6px; background: rgba(33,88,237,0.1); border: 1px solid var(--blue); color: #60a5fa; padding: 5px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 22px; }
        .status .dot { width: 6px; height: 6px; background-color: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: blink 1.2s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        .title { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 32px; }
        .shield { display: flex; align-items: center; justify-content: center; color: var(--blue); filter: drop-shadow(0 0 8px rgba(33,88,237,0.6)); flex-shrink: 0; }
        .group { display: flex; flex-direction: column; text-align: left; }
        .error { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: 2px; line-height: 1.1; }
        .error-reason { font-size: 14px; font-weight: 600; color: var(--gray); letter-spacing: 4px; text-transform: uppercase; margin: 6px 0 0 0; opacity: 0.85; }
        .button { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--blue); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 18px 32px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; width: 100%; box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: all 0.25s ease; margin-bottom: 32px; }
        .button:hover { background: #3b66ff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(33, 88, 237, 0.6); border-color: rgba(255,255,255,0.3); }
        .button:active { transform: translateY(0); }
        .button svg { transform: translateX(0); transition: transform 0.3s ease; }
        .button:hover svg { transform: translateX(4px); }
        .footer { display: block; font-size: 11px; color: #6B7280; margin-top: 12px; letter-spacing: 0.5px; user-select: none; line-height: 1.6; }
		.scale-wrapper { width: 100%; max-width: 300px; aspect-ratio: 16 / 9; overflow: auto; }
        @media (max-width: 480px) { .card { padding: 45px 24px; width: 90%; } .title { font-size: 28px; } .slogan { font-size: 12px; } .title { gap: 10px; } }
    </style>
</head>
<body>

<div class="grid"></div>

<div class="card" id="portalCard">
    <div class="status"><div class="dot"></div><span>All systems operational</span></div>
    <div class="title">
        <div class="shield">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9.17 9A3 3 0 0 1 15 10c0 1.5-1.5 2.5-2.5 3.5"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>
        <div class="group">
            <h1 class="error">安全检查</h1>
            <div class="error-reason">您需要先通过一份简短的验证</div>
			<div class="scale-wrapper">::IM_UNDER_ATTACK_BOX::</div>
        </div>
    </div>
    <button class="button" id="enterBtn">
        <span>返回官网</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </button>
    <span> <h2 class="footer">Ray ID: ::RAY_ID:: </br>Client IP: ::CLIENT_IP:: </h2> </span>
</div>

<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'c') e.preventDefault(); });

    const MAIN_SITE_URL = "https://mifjun.com";

    document.getElementById('enterBtn').addEventListener('click', function () {
        const portalCard = document.getElementById('portalCard');
        portalCard.style.opacity = '0';
        portalCard.style.transform = 'scale(1.015)';
        portalCard.style.filter = 'blur(12px)';
        portalCard.style.pointerEvents = 'none';
        setTimeout(() => { window.location.href = MAIN_SITE_URL; }, 400);
    });
</script>

</body>
</html>
