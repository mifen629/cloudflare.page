<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24' fill='none' stroke='%232158ED' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'%3E%3C/path%3E%3Cpath d='M12 19s5.5-2.5 5.5-7.5V7.2l-5.5-2-5.5 2v4.3c0 5 5.5 7.5 5.5 7.5z' fill='%232158ED' stroke='none'%3E%3C/path%3E%3Cpath d='M10.4 9.5v3.3c0 1 0.6 1.6 1.6 1.6s1.6-0.6 1.6-1.6V9.5' stroke='%23FFF' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3C/path%3E%3C/svg%3E" type="image/svg+xml" />
	<title>内部故障</title>
    <style>
        :root { --bg: #000000; --card: rgba(7,10,19,0.9); --blue: #2158ed; --text: #ffffff; --gray: #8e9aa8; --green: #00ffaa; --red: #ff5555; scrollbar-width: none; -ms-overflow-style: none; }
        html, body { min-height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; overflow-y: auto; }
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; position: relative; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; box-sizing: border-box; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(20px, env(safe-area-inset-bottom)); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
		.grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(33,88,237,0.25) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(33,88,237,0.25) 1.5px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 1; }
        .card { background: var(--card); border: 2px solid var(--blue); box-shadow: 0 0 35px var(--blue), inset 0 0 20px rgba(33,88,237,0.15); border-radius: 20px; padding: 50px 35px; width: 88%; max-width: 420px; text-align: center; z-index: 2; box-sizing: border-box; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); animation: cardFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes cardFadeIn { 0% { opacity: 0; transform: translateY(12px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .status { display: inline-flex; align-items: center; gap: 6px; background: rgba(33,88,237,0.1); border: 1px solid var(--blue); color: #60a5fa; padding: 5px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 22px; }
        .status .dot { width: 6px; height: 6px; background-color: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: blink 1.2s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        .title { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 32px; }
        .shield { display: flex; align-items: center; justify-content: center; color: var(--blue); filter: drop-shadow(0 0 8px rgba(33,88,237,0.6)); flex-shrink: 0; }
        .group { display: flex; flex-direction: column; text-align: left; }
        .check { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: 2px; line-height: 1.1; }
        .check-reason { font-size: 14px; font-weight: 600; color: var(--gray); letter-spacing: 4px; text-transform: uppercase; margin: 6px 0 0 0; opacity: 0.85; }
		.error-box { width: 100%; height: auto; box-sizing: border-box; padding: 16px; margin-bottom: 0; overflow-wrap: anywhere; text-align: left; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(33, 88, 237, 0.65); border-radius: 10px; box-shadow: inset 0 0 15px rgba(33, 88, 237, 0.08); color: #a7b9d0; font-family: Consolas, Monaco, "Courier New", monospace; font-size: 12px; line-height: 1.7; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;}
		.error-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(33, 88, 237, 0.3); color: #60a5fa; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
		.error-indicator { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 7px var(--red); animation: errorblink 0.6s ease-in-out infinite alternate; }
		.error-content { white-space: normal; overflow-wrap: break-word; word-break: normal; line-height: 1.8; zoom: 0.95; }
		@keyframes errorblink { from { opacity: 0.3; box-shadow: 0 0 2px var(--red); } to { opacity: 1; box-shadow: 0 0 10px var(--red); } }
        @media (max-width: 480px) { .card { padding: 45px 24px; width: 90%; } .title { font-size: 28px; } .slogan { font-size: 12px; } .title { gap: 10px; } }
		@supports (min-height: 100dvh) { body { min-height: 100dvh; } }
    </style>
</head>
<body>

<div class="grid"></div>

<div class="card" id="portalCard">
    <div class="status"><div class="dot"></div><span>All systems operational</span></div>
    <div class="title">
        <div class="shield">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 19s5.5-2.5 5.5-7.5V7.2l-5.5-2-5.5 2v4.3c0 5 5.5 7.5 5.5 7.5z" fill="#2158ED" stroke="none"></path><path d="M10 10l4 4M14 10l-4 4" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
        </div>
        <div class="group">
            <h1 class="check">内部故障</h1>
            <div class="check-reason">服务器故障导致无法建立连接</div>
        </div>
    </div>
<div class="error-box">
    <div class="error-header">
        <span><i class="error-indicator"></i>详细报告</span>
        <span>来自 CLOUDFLARE</span>
    </div>
    <div class="error-content" id="error">::CLOUDFLARE_ERROR_1000S_BOX::</div>
</div>
</div>

</body>
</html>
